name: CI/CD Pipeline Composite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: ./.github/actions/setup-jdk
    
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload Artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: artifact
          path: target/*.jar

  unit-test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: ./.github/actions/checkout-repository

      - name: Set up JDK 17
        uses: ./.github/actions/setup-jdk
    
      - name: Download Artifact
        uses: ./.github/actions/download-artifact
        with:
          name: artifact
          path: target/

      - name: Run Application
        run: |
          java -jar target/*.jar &
          until curl --silent --fail http://localhost:8080/api/health; do
            echo "Waiting for application to be healthy..."
            sleep 5
          done

      - name: Run Unit Tests
        run: mvn clean test

  karate-test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: ./.github/actions/checkout-repository

      - name: Set up JDK 17
        uses: ./.github/actions/setup-jdk

      - name: Download Artifact
        uses: ./.github/actions/download-artifact
        with:
          name: artifact
          path: target/

      - name: Run Application
        run: |
          java -jar target/*.jar &
          until curl --silent --fail http://localhost:8080/api/health; do
            echo "Waiting for application to be healthy..."
            sleep 5
          done

      - name: Run Karate DSL Tests
        run: mvn clean test -Dtest=ApiTest

      - name: Upload Cucumber HTML Report
        uses: ./.github/actions/upload-artifact
        with:
          name: cucumber-html-report
          path: target/cucumber-html-reports/